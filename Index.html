<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>برای تو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
:root{--night:#070a24;--indigo:#141a4e;--gold:#e8c982;--ink:#eef0ff;--mute:#a7addb;--line:rgba(232,201,130,.28);--script:Vazirmatn,Tahoma,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);line-height:2;overflow-x:hidden;
 background:radial-gradient(ellipse at 15% 8%,rgba(122,90,210,.28),transparent 55%),radial-gradient(ellipse at 85% 65%,rgba(240,160,180,.10),transparent 50%),linear-gradient(var(--night),var(--indigo) 55%,var(--night)) fixed}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{display:none;position:relative;z-index:1;padding-bottom:env(safe-area-inset-bottom,0)}
body.in main{display:block}
section{max-width:680px;margin:auto;padding:84px 22px}
h2{font-family:var(--script);font-weight:400;font-size:2rem;color:var(--gold);text-align:center;margin-bottom:46px;line-height:1.6}
.moon{width:120px;height:120px;border-radius:50%;margin:0 0 10px;
 background:
  url(photos/moon.jpg) center/cover no-repeat,
  radial-gradient(circle at 36% 33%,rgba(78,78,84,.62),transparent 17%),
  radial-gradient(circle at 60% 27%,rgba(88,88,94,.55),transparent 19%),
  radial-gradient(circle at 50% 56%,rgba(92,92,98,.5),transparent 21%),
  radial-gradient(circle at 28% 62%,rgba(105,105,110,.42),transparent 13%),
  radial-gradient(circle at 70% 64%,rgba(100,100,106,.42),transparent 12%),
  radial-gradient(circle at 44% 80%,rgba(120,120,125,.3),transparent 9%),
  radial-gradient(circle at 38% 34%,#f4f0e6,#cdc8bb 58%,#8c887e 100%);
 box-shadow:inset -14px -10px 28px rgba(0,0,0,.55),0 0 50px rgba(240,235,215,.3),0 0 120px rgba(150,160,255,.15)}
#gate .moon{width:96px;height:96px}

/* gate */
#gate{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;transition:opacity .7s}
#gate.out{opacity:0;pointer-events:none}
#gate p{color:var(--mute);font-weight:300}
#gate h1{font-family:var(--script);font-weight:400;font-size:1.9rem;color:var(--gold)}
#gate form{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:300px}
input{width:100%;font:inherit;text-align:center;direction:ltr;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:10px 18px}
input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#err{min-height:1.6em;font-size:.85rem;color:#f2b8c6}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* hero */
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.hero h1{font-family:var(--script);font-weight:300;font-size:clamp(2.8rem,13vw,5.4rem);color:var(--gold);line-height:1.6;text-shadow:0 0 30px rgba(232,201,130,.3)}
.hero p{color:var(--mute);font-weight:300}
.hero>*{opacity:0;animation:rise 1.6s ease forwards}
.hero>:nth-child(2){animation-delay:.7s}.hero>:nth-child(3){animation-delay:1.4s}.hero>:nth-child(4){animation-delay:2.1s}.hero>:nth-child(5){animation-delay:2.6s}
@keyframes rise{from{opacity:0;filter:blur(8px);transform:translateY(10px)}to{opacity:1;filter:none;transform:none}}
.counter{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:420px;margin:24px 0 6px}
.counter div{border-top:1px solid var(--line);padding-top:10px}
.counter b{display:block;font-weight:200;font-size:clamp(1.7rem,8vw,2.6rem);font-variant-numeric:tabular-nums}
.counter small{color:var(--mute);font-size:.8rem}
#next{font-size:.9rem}

/* timeline */
.tl{border-right:1px solid var(--line);padding-right:28px}
.tl article{position:relative;margin-bottom:54px}
.tl article::before{content:"";position:absolute;right:-34px;top:10px;width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(232,201,130,.12),0 0 14px var(--gold)}
.tl time{color:var(--gold);font-size:.85rem}
.tl h3{font-weight:600;font-size:1.15rem}
.tl p{color:var(--mute);font-weight:300}
.tl img{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:14px;margin-top:16px;border:1px solid var(--line);padding:5px;background:rgba(255,255,255,.03)}

/* reasons */
.why{text-align:center}
#reason{min-height:11em;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding:26px 20px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.035);cursor:pointer;transition:opacity .35s}
#reason i{font-style:normal;color:var(--gold);font-size:1.2rem}
#reason strong{font-family:var(--script);font-weight:400;font-size:clamp(1.6rem,7vw,2.2rem);color:var(--gold);line-height:1.7}
#reason span{color:var(--mute);font-weight:300;max-width:30em}
button{font:inherit;cursor:pointer;color:var(--gold);background:none;border:1px solid var(--line);border-radius:999px;padding:8px 28px;margin-top:20px;transition:background .2s}
button:hover{background:rgba(232,201,130,.1)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.cnt{display:block;color:var(--mute);font-size:.8rem;margin-top:12px}

/* wishes */
.wish{max-width:760px}
.wish .lead{text-align:center;color:var(--mute);font-weight:300;margin:-26px 0 22px}
.sky{position:relative;height:clamp(340px,72vw,430px);border:1px solid var(--line);border-radius:26px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,rgba(122,90,210,.2),transparent 70%),rgba(255,255,255,.025)}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
.sky polyline{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 5;vector-effect:non-scaling-stroke}
.star{position:absolute;transform:translate(-50%,-50%);width:64px;margin:0;padding:4px 0;border:0;background:none;color:var(--gold);display:flex;flex-direction:column;align-items:center;gap:0;border-radius:14px}
.star:hover{background:none}
.star i{font-style:normal;font-size:2rem;line-height:1.2;text-shadow:0 0 14px var(--gold),0 0 32px rgba(232,201,130,.5);animation:pulse 3.2s ease-in-out infinite}
.star small{font-size:.72rem;color:var(--ink);white-space:nowrap;font-weight:300}
@keyframes pulse{50%{transform:scale(1.2);opacity:.75}}
#lb{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:rgba(5,7,24,.84);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s}
#lb.on{opacity:1;pointer-events:auto}
#lb .card{width:100%;max-width:520px;max-height:100%;overflow:auto;text-align:center;transform:scale(.96);transition:transform .4s}
#lb.on .card{transform:none}
#lb img{display:block;width:100%;max-height:50vh;object-fit:cover;border-radius:16px;border:1px solid var(--line);padding:5px;background:rgba(255,255,255,.04);box-shadow:0 0 80px rgba(232,201,130,.14)}
#lb small{display:block;color:var(--mute);margin-top:14px;font-size:.8rem}
#lb h3{font-family:var(--script);font-weight:400;font-size:1.8rem;color:var(--gold);line-height:1.7}
#lb p{font-weight:300}
.nav{display:flex;justify-content:center;gap:10px}
.nav button{margin-top:10px;padding:6px 20px}

/* music */
#mus{position:fixed;z-index:7;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:44px;height:44px;margin:0;padding:0;display:none;align-items:center;justify-content:center;font-size:1.3rem;border-radius:50%;background:rgba(10,14,46,.7);backdrop-filter:blur(6px)}
#mus.off{opacity:.55}
#mus.off::after{content:"";position:absolute;width:26px;height:1.5px;background:var(--gold);transform:rotate(-45deg)}

/* letter */
.letter{text-align:center}
#open{display:inline-flex;align-items:center;gap:10px}
#paper{display:none;text-align:right;margin-top:30px;padding:30px 24px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.04);box-shadow:0 0 60px rgba(232,201,130,.06)}
#paper p{margin-bottom:14px;font-weight:300;min-height:2em;white-space:pre-line}
#paper .end{font-family:var(--script);font-weight:600;color:var(--gold);font-size:1.8rem;text-align:center}
#paper .sign{font-family:var(--script);color:var(--gold);font-size:1.3rem;margin-top:24px}
footer{text-align:center;color:var(--mute);font-size:.8rem;padding:20px 0 60px}
@media(prefers-reduced-motion:reduce){.hero>*{animation:none;opacity:1}#reason{transition:none}html{scroll-behavior:auto}#gate{transition:none}.star i{animation:none}#lb,#lb .card{transition:none}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<audio id="bgm" src="audio/music.mp3" loop preload="metadata"></audio>
<button id="mus" type="button" aria-label="پخش یا قطع موسیقی">♪</button>

<div id="gate">
  <div class="moon" aria-hidden="true"></div>
  <h1>این‌جا فقط برای توئه</h1>
  <p>تاریخ آشنایی‌مون رو بنویس (سال/ماه/روز)</p>
  <form id="f" autocomplete="off">
    <input id="pw" type="text" inputmode="text" placeholder="۱۴۰۳/۰۰/۰۰" aria-label="رمز">
    <button type="submit">ورود</button>
    <div id="err" role="alert"></div>
  </form>
</div>

<main>
<section class="hero">
  <div class="moon" aria-hidden="true"></div>
  <h1 id="title">دختر زیبای شب</h1>
  <p>از ۱۵ آبان ۱۴۰۳، ساعت ۱۰:۳۰ صبح</p>
  <div class="counter">
    <div><b id="d">۰</b><small>روز</small></div>
    <div><b id="h">۰</b><small>ساعت</small></div>
    <div><b id="m">۰</b><small>دقیقه</small></div>
    <div><b id="s">۰</b><small>ثانیه</small></div>
  </div>
  <p id="next"></p>
</section>

<section>
  <h2>قصه‌ی ما</h2>
  <div class="tl" id="tl"></div>
</section>

<section class="why">
  <h2>چرا دوستت دارم</h2>
  <div id="reason" aria-live="polite" tabindex="0"></div>
  <button id="more" type="button">دلیل بعدی</button>
  <span class="cnt" id="cnt"></span>
</section>

<section class="wish">
  <h2>آسمان آرزوها</h2>
  <p class="lead">این‌ها آینده‌ایه که کنار تو تصور کردم. هر ستاره یه آرزوعه، بزن روش.</p>
  <div class="sky" id="sky"></div>
</section>

<section class="letter">
  <h2>یه نامه برای تو</h2>
  <button id="open" type="button">
    <svg width="22" height="16" viewBox="0 0 22 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x=".7" y=".7" width="20.6" height="14.6" rx="2"/><path d="M1 1.5l10 7.5 10-7.5"/></svg>
    نامه رو باز کن
  </button>
  <div id="paper"></div>
</section>

<footer>دومین سالگرد، ۱۵ آبان ۱۴۰۵</footer>
</main>

<div id="lb" role="dialog" aria-modal="true" aria-label="آرزو">
  <div class="card">
    <img id="lbimg" alt="">
    <small id="lbk"></small>
    <h3 id="lbt"></h3>
    <p id="lbp"></p>
    <div class="nav">
      <button type="button" id="lbprev">قبلی</button>
      <button type="button" id="lbclose">بستن</button>
      <button type="button" id="lbnext">بعدی</button>
    </div>
  </div>
</div>

<script>
// ================= تنظیمات (فقط این قسمت رو ویرایش کن) =================
const PASS  = '1403/8/15';                               // رمز: تاریخ آشنایی (سال/ماه/روز بدون صفر اضافه)
const START = new Date('2024-11-05T10:30:00+03:30');      // ۱۵ آبان ۱۴۰۳، ۱۰:۳۰ صبح
const ANNIV = new Date('2026-11-06T10:30:00+03:30');      // ۱۵ آبان ۱۴۰۵
const MY_NAME = 'سهیل';

// عکس‌ها داخل پوشه‌ی photos کنار همین فایل. اگه عکسی نبود، خودکار نشون داده نمی‌شه.
const MOMENTS = [
  {d:'۱۵ آبان ۱۴۰۳', t:'شروع ماجرای ما', img:'photos/1.jpg',
   p:'اولین ترم روانشناسی، درست وقتی بعد از یک سال، از رشته قبلیم انصراف دادم. و با تو آشنا شدم. اولین باری که دیدمت، متوجه تفاوتت با دیگران شدم. و برای همین هم جذبت شدم. به بهانه جزوه باهات ارتباط گرفتم و قصه از همونجا شروع شد'},
  {d:'۱۰ آذر ۱۴۰۳', t:'اولین قرار، دریاچه‌ی چیتگر', img:'photos/2.jpg',
   p:'روز استثنایی ای بود. باهمدیگه رفتیم دریاچه چیتگر و اولین دیت عاشفانه مون بود. گربه ای که در ارتفاع گیر افتاده بود رو نجات دادیم و کنار طعم عشق، یه طعم جدیدی رو تجربه کردیم. سوسیس سیب زمینی. و من اینثدر ازت سوال پرسیدم که تو صحبت کنی و من بیشتر بخورم.'},
  {d:'۲۸ آذر ۱۴۰۳', t:'اولین پیک‌نیک، پارک جنگلی چیتگر', img:'photos/3.jpg',
   p:'ناهار تو دل طبیعت. همراه با چای آتیشی و کلی عشق بازی های دو نفره. و منی که دلم نمیخواست اون روز تموم بشه.'}
];
const REASONS = [
  ['چون من رو می‌فهمی','بدون اینکه همه‌چیز رو توضیح بدم، می‌فهمی من چی می‌گم و چی حس می‌کنم. این برای من یه دنیاست.'],
  ['چون زیبایی','نه فقط وقتی نگات می‌کنم، بلکه توی همه‌ی کارهایی که می‌کنی.'],
  ['چون زندگیت آروم و منظمه','کنار تو یاد می‌گیرم که یه زندگی سالم و متعادل چه حس خوبی داره.'],
  ['چون عشقت رو نشون می‌دی','لازم نیست حدس بزنم. می‌دونم دوستم داری، چون هر روز نشونم می‌دی.'],
  ['چون توی سختی‌ها کنارم موندی','وقتی همه‌چیز سخت بود، دستم رو ول نکردی. این رو هیچ‌وقت فراموش نمی‌کنم.'],
  ['چون عطسه‌هات...','بامزه‌ترین صدای دنیاست، و من پنهونی منتظرشم.']
];
const LETTER = [
  'محبوبم،',
  'امروز، در هفتصد و سی و یکمین روز از رابطه‌مون، باید بهت بگم که دو ساله طعم عشق واقعی و حقیقی رو توی زندگیم می‌چشم، و همه‌ش رو مدیون توام.',
  'من و تو روزهای تلخ و شیرین زیادی با هم داشتیم. از استرس مصاحبه‌های من تا روزی که استخدام شدم. از استرس امتحان‌های دانشگاه تا روزی که قبول شدیم. از استرس روزهای جنگ تا روزی که پشت سرشون گذاشتیم.',
  'و تمام شادی‌ها و غم‌هایی که با هم تجربه کردیم، وقتی می‌دونستیم کسی رو جز همدیگه نداریم.',
  ['و موندیم.','end'],
  'مبارک‌مون باشه، دومین سالگرد آشنایی‌مون.',
  ['همیشگیه تو،\n' + MY_NAME,'sign']
];
// =======================================================================

const $ = id => document.getElementById(id);
const fa = n => Number(n).toLocaleString('fa-IR',{useGrouping:false});
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const el = (tag,txt,cls) => { const e=document.createElement(tag); if(txt) e.textContent=txt; if(cls) e.className=cls; return e; };

// ---- موسیقی ----
const bgm = $('bgm'), mus = $('mus'), VOL = .55;
let fade = null;
function fadeTo(v, done){
  clearInterval(fade);
  fade = setInterval(()=>{
    const d = v - bgm.volume;
    if(Math.abs(d) < .03){ bgm.volume = v; clearInterval(fade); if(done) done(); }
    else bgm.volume = Math.min(1, Math.max(0, bgm.volume + Math.sign(d)*.03));
  }, 90);
}
bgm.addEventListener('loadedmetadata', ()=>{ mus.style.display = 'flex'; });
function startMusic(){
  bgm.volume = 0;
  bgm.play().then(()=>{ mus.classList.remove('off'); fadeTo(VOL); }).catch(()=>{ mus.classList.add('off'); });
}
mus.onclick = ()=>{
  if(bgm.paused){ bgm.play().then(()=>{ mus.classList.remove('off'); fadeTo(VOL); }); }
  else { mus.classList.add('off'); fadeTo(0, ()=>bgm.pause()); }
};

// ---- ورود ----
const norm = s => { const m = s.replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).match(/\d+/g); return m ? m.map(Number).join('/') : ''; };
$('f').onsubmit = e => {
  e.preventDefault();
  if(norm($('pw').value) === PASS){
    $('gate').classList.add('out'); startMusic();
    setTimeout(()=>{ $('gate').remove(); document.body.classList.add('in'); }, reduce?0:700);
  } else {
    $('err').textContent = 'درست نبود، دوباره امتحان کن';
    $('f').classList.remove('shake'); void $('f').offsetWidth; $('f').classList.add('shake');
  }
};
$('pw').focus();

// ---- شمارنده ----
function tick(){
  const now = new Date(), sec = Math.floor((now - START)/1000);
  $('d').textContent = fa(Math.floor(sec/86400));
  $('h').textContent = fa(Math.floor(sec%86400/3600));
  $('m').textContent = fa(Math.floor(sec%3600/60));
  $('s').textContent = fa(sec%60);
  const left = ANNIV - now;
  $('next').textContent = left > 0
    ? 'تا دومین سالگرد: ' + fa(Math.floor(left/864e5)) + ' روز و ' + fa(Math.floor(left%864e5/36e5)) + ' ساعت'
    : 'دومین سالگرد مبارک 🌙';
}
tick(); setInterval(tick,1000);

// ---- خط زمانی ----
MOMENTS.forEach(m=>{
  const a = el('article');
  a.append(el('time',m.d), el('h3',m.t), el('p',m.p));
  if(m.img){ const i = el('img'); i.src=m.img; i.alt=''; i.loading='lazy'; i.onerror=()=>i.remove(); a.append(i); }
  $('tl').append(a);
});

// ---- دلایل ----
let ri = 0;
function showReason(){
  const box = $('reason'), r = REASONS[ri];
  box.style.opacity = 0;
  setTimeout(()=>{
    box.replaceChildren(el('i','✦'), el('strong',r[0]), el('span',r[1]));
    $('cnt').textContent = fa(ri+1) + ' از ' + fa(REASONS.length);
    box.style.opacity = 1;
  }, reduce?0:180);
}
const nextReason = ()=>{ ri = (ri+1)%REASONS.length; showReason(); };
$('more').onclick = nextReason; $('reason').onclick = nextReason;
showReason();

// ---- آسمان آرزوها ----
// عکس‌ها: photos/wish0.jpg تا wish4.jpg (ترتیب: عروسی، کار در خونه، شمال، مبل، خانواده)
const WISHES = [
  {t:'روزی که «بله» رو بگیم و زنذگیمون رو شروع کنیم.', img:'photos/wish0.jpg',
   p:'توی این آرزو، دست تو در دست من خواهد بود. از یه کلاس و در کنار هم تا اینجا...'},
  {t:'یه روز معمولی، خیلی خاص', img:'photos/wish1.jpg',
   p:'و این بهترین اتفاقیه که بین فشار و سختی کار، میتونه خستگی رو از تنم بیرون کنه'},
  {t:'شب، دریا و آتیش', img:'photos/wish2.jpg',
   p:'شمال، صدای موج، بوی چوب سوخته و تو کنارم. مثل چای روی آتیش اولین پیک‌نیکمون، فقط این بار دریا هم کنارمونه.'},
  {t:'ساده‌ترین بهشت', img:'photos/wish3.jpg',
   p:'یه مبل، یه فیلم و تو کنارم. بعد از یه روز طولانی، این بهترین تراپی برای منه.'},
  {t:'خانواده‌ی ما', img:'photos/wish4.jpg',
   p:'و این بیشترین و بزرگترین سرمایه ما خواهد بود'}
];
const POS = [[82,68],[66,28],[48,62],[30,26],[14,58]];
(function(){
  const sky = $('sky'), NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS,'svg'), pl = document.createElementNS(NS,'polyline');
  svg.setAttribute('viewBox','0 0 100 100'); svg.setAttribute('preserveAspectRatio','none'); svg.setAttribute('aria-hidden','true');
  pl.setAttribute('points', POS.map(p=>p.join(',')).join(' ')); svg.append(pl); sky.append(svg);
  WISHES.forEach((w,i)=>{
    const b = el('button','','star'); b.type = 'button';
    b.style.left = POS[i][0] + '%'; b.style.top = POS[i][1] + '%';
    const ic = el('i','✦'); ic.style.animationDelay = (i*.6) + 's';
    b.append(ic, el('small',w.s)); b.setAttribute('aria-label', w.t);
    b.onclick = () => openWish(i); sky.append(b);
  });
  let wi = 0, back = null, x0 = 0;
  const lb = $('lb');
  function show(i){
    wi = (i + WISHES.length) % WISHES.length; const w = WISHES[wi], im = $('lbimg');
    im.style.display = ''; im.onerror = () => { im.style.display = 'none'; }; im.src = w.img; im.alt = w.t;
    $('lbk').textContent = 'آرزوی ' + fa(wi+1) + ' از ' + fa(WISHES.length);
    $('lbt').textContent = w.t; $('lbp').textContent = w.p;
  }
  window.openWish = i => { back = document.activeElement; show(i); lb.classList.add('on'); document.body.style.overflow = 'hidden'; $('lbclose').focus(); };
  const close = () => { lb.classList.remove('on'); document.body.style.overflow = ''; if(back) back.focus(); };
  $('lbclose').onclick = close; $('lbprev').onclick = () => show(wi-1); $('lbnext').onclick = () => show(wi+1);
  lb.onclick = e => { if(e.target === lb) close(); };
  addEventListener('keydown', e => {
    if(!lb.classList.contains('on')) return;
    if(e.key === 'Escape') close();
    if(e.key === 'ArrowLeft') show(wi+1);
    if(e.key === 'ArrowRight') show(wi-1);
  });
  lb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
  lb.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - x0; if(dx < -50) show(wi+1); else if(dx > 50) show(wi-1); });
})();

// ---- نامه ----
$('open').onclick = async function(){
  this.style.display = 'none';
  const paper = $('paper'); paper.style.display = 'block';
  for(const item of LETTER){
    const [txt,cls] = Array.isArray(item) ? item : [item,''];
    const p = el('p','',cls); paper.append(p);
    if(reduce){ p.textContent = txt; continue; }
    for(const ch of txt){
      p.textContent += ch;
      await new Promise(r=>setTimeout(r, '،.'.includes(ch) ? 160 : 28));
    }
    p.scrollIntoView({block:'nearest',behavior:'smooth'});
    await new Promise(r=>setTimeout(r, cls==='end' ? 900 : 350));
  }
};

// ---- ستاره‌ها و شهاب ----
(function(){
  const c = $('stars'), x = c.getContext('2d');
  let w, h, stars = [], shoots = [], nextShoot = 0;
  function size(){
    w = c.width = innerWidth; h = c.height = innerHeight;
    stars = Array.from({length: Math.min(150, Math.floor(w*h/8000))}, ()=>({x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.3+.3, p:Math.random()*6.28, v:Math.random()*.02+.005}));
  }
  function draw(t){
    x.clearRect(0,0,w,h);
    for(const s of stars){
      x.fillStyle = 'rgba(232,201,130,' + (reduce ? .6 : .3 + .4*Math.sin(s.p + t*s.v*.1)) + ')';
      x.beginPath(); x.arc(s.x,s.y,s.r,0,6.28); x.fill();
    }
    if(!reduce){
      if(t > nextShoot && shoots.length < 9){
        const sp = 6 + Math.random()*9, an = .35 + Math.random()*.35, len = 60 + Math.random()*90;
        shoots.push({x:Math.random()*w*1.2, y:-20 + Math.random()*h*.55, vx:-sp*Math.cos(an), vy:sp*Math.sin(an), len, l:0, life:55 + Math.random()*45});
        nextShoot = t + 250 + Math.random()*750;
      }
      shoots = shoots.filter(s => s.l < s.life);
      for(const s of shoots){
        s.x += s.vx; s.y += s.vy; s.l++;
        const a = Math.sin(Math.PI * s.l / s.life), k = s.len / Math.hypot(s.vx,s.vy);
        const tx = s.x - s.vx*k, ty = s.y - s.vy*k;
        const g = x.createLinearGradient(s.x,s.y,tx,ty);
        g.addColorStop(0,'rgba(255,244,214,' + a*.95 + ')'); g.addColorStop(1,'rgba(255,244,214,0)');
        x.strokeStyle = g; x.lineWidth = 1.6; x.beginPath(); x.moveTo(s.x,s.y); x.lineTo(tx,ty); x.stroke();
      }
      requestAnimationFrame(draw);
    }
  }
  addEventListener('resize', ()=>{ size(); if(reduce) draw(0); });
  size(); requestAnimationFrame(draw);
})();
</script>
